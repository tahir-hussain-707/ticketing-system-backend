server:
  port: 8080

spring:
  application:
    name: ticketing-system
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing}
    username: ${DB_USER:ticketing}
    password: ${DB_PASSWORD:ticketing}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    # Comma-separated list of allowed browser origins for /api/v1/**. Dev default covers a
    # locally-run frontend (e.g. Vite's default port); override per environment.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  chatbot:
    similarity-threshold: ${CHATBOT_SIMILARITY_THRESHOLD:0.75}
    retention-days: ${CHATBOT_RETENTION_DAYS:90}
    inactivity-minutes: ${CHATBOT_INACTIVITY_MINUTES:30}
    retrieval-limit: ${CHATBOT_RETRIEVAL_LIMIT:5}
  ai:
    # 005-auth-rag-chatbot research.md "Embedding generation" / "Response generation" — amended
    # to a local Ollama instance (no API key: it runs on this host or one you control).
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:mxbai-embed-large}
      chat-model: ${OLLAMA_CHAT_MODEL:llama3.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
