openapi: 3.0.3
info:
  title: Ticket Ownership, Assignment & Scoped Listing API
  version: "1.0"
  description: >
    Delta from feature 004-auth-ticket-access onto the existing tickets/comments contracts
    (001-ticket-management-backend/contracts/tickets-api.yaml,
    002-list-comments/contracts/comments-list-api.yaml): every endpoint below now requires an
    authenticated session (FR-006, FR-007, FR-012, FR-014) unless noted otherwise, request/
    response schemas for `assignee`/`createdBy`/comment authorship change shape, and one new
    endpoint (reassignment) is added. `GET /tickets/{ticketId}` and
    `GET /tickets/{ticketId}/comments` are UNCHANGED by this feature (still unauthenticated) and
    are not repeated here.
servers:
  - url: /api/v1

paths:
  /tickets:
    post:
      summary: Create a ticket (FR-001 from 001, now requires auth per FR-006; assignee is never caller-supplied per FR-008)
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreateRequest' }
      responses:
        '201':
          description: Ticket created, status OPEN, auto-assigned per FR-009/FR-010/FR-011
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '400':
          description: Validation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401':
          description: Not authenticated (FR-006)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    get:
      summary: List tickets, now with an ownership scope (FR-014, FR-015)
      operationId: listTickets
      parameters:
        - name: scope
          in: query
          required: false
          description: >
            `mine` (created by the caller), `assigned` (assigned to the caller), or `all` (every
            ticket the caller is permitted to see — narrowed to `mine` for a GENERAL caller).
            Default: `all`.
          schema: { $ref: '#/components/schemas/TicketScope' }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Page of tickets matching scope + filters (FR-014, FR-015)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketPage' }
        '401':
          description: Not authenticated (needed to resolve "the requesting user")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /tickets/{ticketId}/assignee:
    patch:
      summary: Manually reassign a ticket — ADMIN only (FR-016)
      operationId: reassignTicket
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassignRequest' }
      responses:
        '200':
          description: Reassigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '400':
          description: Target user is not a SUPPORT user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Caller is not ADMIN (FR-016)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Ticket or target user not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /tickets/{ticketId}/comments:
    post:
      summary: Add a comment — creator or assignee only (FR-012); comment is attributed by name (FR-013)
      operationId: addComment
      parameters:
        - name: ticketId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentCreateRequest' }
      responses:
        '201':
          description: Comment added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentResponse' }
        '401':
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403':
          description: Caller is neither the ticket's creator nor its assignee (FR-012)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Ticket not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

components:
  schemas:
    TicketScope:
      type: string
      enum: [mine, assigned, all]

    UserSummary:
      type: object
      description: Replaces the old free-text `assignee` string wherever a user is referenced.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    TicketCreateRequest:
      type: object
      description: Unchanged from 001 except `assignee` is removed (FR-008) — the server decides it.
      required: [title, description]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }

    ReassignRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId: { type: string, format: uuid }

    TicketResponse:
      type: object
      description: Same fields as 001's TicketResponse, but `assignee` is now nullable UserSummary and `createdBy` is added.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED] }
        assignee:
          allOf: [{ $ref: '#/components/schemas/UserSummary' }]
          nullable: true
        createdBy: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TicketPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/TicketResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    CommentCreateRequest:
      type: object
      description: Unchanged shape from 001/002 — content only; author comes from the session.
      required: [content]
      properties:
        content: { type: string }

    CommentResponse:
      type: object
      description: Same fields as 001/002's CommentResponse, plus `authorName` (FR-013).
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        content: { type: string }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }

    ApiError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
