openapi: 3.0.3
info:
  title: Ticket Management Backend API
  version: "1.0"
  description: >
    Backend contract for the Support Ticket Management System (feature
    001-ticket-management-backend). Status changes are ONLY reachable via the
    /transitions endpoint (FR-013) — PATCH never accepts a status field.
servers:
  - url: /api/v1

paths:
  /tickets:
    post:
      summary: Create a ticket (FR-001)
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreateRequest' }
      responses:
        '201':
          description: Ticket created, status OPEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '400':
          description: Validation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    get:
      summary: List tickets, optionally filtered by status and/or keyword (FR-002, FR-006, FR-007)
      operationId: listTickets
      parameters:
        - name: q
          in: query
          required: false
          description: Keyword matched against title and description (FR-006)
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: Filter by exact ticket status (FR-007)
          schema: { $ref: '#/components/schemas/TicketStatus' }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Page of tickets matching the given filters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketPage' }

  /tickets/{ticketId}:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get full ticket details including comments (FR-003)
      operationId: getTicket
      responses:
        '200':
          description: Full ticket record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetailResponse' }
        '404':
          description: Ticket not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    patch:
      summary: Update title, description, priority, and/or assignee (FR-004). Never accepts status (FR-013).
      operationId: updateTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketUpdateRequest' }
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '400':
          description: Validation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Ticket not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Concurrent update conflict (optimistic lock)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /tickets/{ticketId}/transitions:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Transition ticket status per the allowed state machine (FR-009, FR-010)
      operationId: transitionTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketTransitionRequest' }
      responses:
        '200':
          description: Transition applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '404':
          description: Ticket not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Transition not allowed from the ticket's current status (INVALID_TRANSITION), or a concurrent update conflict (TICKET_CONFLICT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /tickets/{ticketId}/comments:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Add a comment to a ticket (FR-005)
      operationId: addComment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentCreateRequest' }
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentResponse' }
        '400':
          description: Validation failure (e.g. empty content)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Ticket not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

components:
  schemas:
    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
    TicketPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    TicketCreateRequest:
      type: object
      required: [title, description]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        assignee: { type: string, nullable: true }

    TicketUpdateRequest:
      type: object
      description: All fields optional; only supplied fields are changed. Never accepts status.
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        assignee: { type: string, nullable: true }

    TicketTransitionRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
          description: Target status. Must be reachable from the ticket's current status.

    TicketResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        status: { $ref: '#/components/schemas/TicketStatus' }
        assignee: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TicketDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TicketResponse'
        - type: object
          properties:
            comments:
              type: array
              items: { $ref: '#/components/schemas/CommentResponse' }

    TicketPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/TicketResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    CommentCreateRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }

    CommentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        content: { type: string }
        createdAt: { type: string, format: date-time }

    ApiError:
      type: object
      description: Single consistent error shape service-wide (constitution Principle I)
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, TICKET_NOT_FOUND, INVALID_TRANSITION, TICKET_CONFLICT]
        message: { type: string }
        timestamp: { type: string, format: date-time }
        path: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
